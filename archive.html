<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extended Work — Khurram Hameed</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --ink: #14161a;
    --muted: #5d6470;
    --line: #dde0e6;
    --accent: #2b4de0;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Instrument Sans', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  a { color: inherit; text-decoration: none; }

  header { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 10; }
  .bar { max-width: 1100px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.15rem; }
  nav { display: flex; gap: 24px; font-size: .95rem; color: var(--muted); }
  nav a:hover, nav a.active { color: var(--ink); font-weight: 600; }

  .intro { max-width: 1100px; margin: 0 auto; padding: 72px 24px 40px; }
  .intro h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1.1; letter-spacing: -.02em; }
  .intro p { margin-top: 20px; max-width: 56ch; color: var(--muted); font-size: 1.1rem; }

  section { max-width: 1100px; margin: 0 auto; padding: 48px 24px; border-top: 1px solid var(--line); }

  .masonry { column-count: 3; column-gap: 24px; }
  @media (max-width: 850px) { .masonry { column-count: 2; } }
  @media (max-width: 560px) { .masonry { column-count: 1; } }

  .card {
    break-inside: avoid;
    margin-bottom: 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08); }

  .media-wrap { overflow: hidden; background: #e8eaee; }
  .media-wrap img, .media-wrap video {
    display: block; width: 100%; height: auto;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .card:hover .media-wrap img { transform: scale(1.04); }

  figcaption { padding: 14px 16px 16px; }
  figcaption strong { display: block; font-weight: 600; }
  figcaption span { font-size: .9rem; color: var(--muted); }

  .ba { --pos: 50%; position: relative; width: 100%; overflow: hidden; touch-action: pan-y; }
  .ba > img:first-child { display: block; width: 100%; height: auto; }
  .ba .ba-before {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    clip-path: inset(0 calc(100% - var(--pos)) 0 0);
  }
  .ba-line {
    position: absolute; top: 0; bottom: 0; left: var(--pos);
    width: 3px; margin-left: -1.5px; background: #fff;
    box-shadow: 0 0 8px rgba(0,0,0,.4); pointer-events: none;
  }
  .ba-line::after {
    content: "\2194"; position: absolute; top: 50%; left: 50%;
    width: 38px; height: 38px; margin: -19px 0 0 -19px;
    border-radius: 50%; background: #fff; color: var(--ink);
    display: grid; place-items: center; font-size: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .ba input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .ba-tag {
    position: absolute; bottom: 10px; padding: 3px 10px; border-radius: 999px;
    background: rgba(20,22,26,.75); color: #fff; font-size: .8rem; pointer-events: none;
  }
  .ba-tag.l { left: 10px; }
  .ba-tag.r { right: 10px; }

  footer { max-width: 1100px; margin: 0 auto; padding: 32px 24px 56px; color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="index.html">Khurram Hameed</a>
    <nav aria-label="Main">
      <a href="index.html#feed">Feed ads</a>
      <a href="index.html#story">Story ads</a>
      <a href="index.html#cleanup">Retouching</a>
      <a href="index.html#video">Video</a>
      <a href="archive.html" class="active">More designs</a>
    </nav>
  </div>
</header>

<main>
  <div class="intro">
    <h1>Extended design showcase</h1>
    <p>Mixed-format ads, motion pieces, and retouching breakdowns in their original aspect ratios.</p>
  </div>

  <section>
    <div class="masonry" id="auto-gallery">

      <figure class="card">
        <div class="media-wrap">
          <video src="videos/sample.mp4" controls muted loop playsinline preload="metadata"></video>
        </div>
        <figcaption><strong>Motion Ad / Reel</strong><span>Plays directly in the feed at original ratio</span></figcaption>
      </figure>

      <figure class="card">
        <div class="ba">
          <img src="pictures/after.jpg" alt="After retouching">
          <img class="ba-before" src="pictures/before.jpg" alt="Before retouching">
          <div class="ba-line"></div>
          <span class="ba-tag l">Before</span>
          <span class="ba-tag r">After</span>
          <input type="range" min="0" max="100" value="50" aria-label="Before and after slider" oninput="this.parentElement.style.setProperty('--pos', this.value + '%')">
        </div>
        <figcaption><strong>AI Cleanup & Retouch</strong><span>Drag slider to compare</span></figcaption>
      </figure>

    </div>
  </section>
</main>

<footer>
  © 2026 Khurram Hameed — Production Designer
</footer>

<script>
  const username = "rezrao";
  const repo = "production-designer-portfolio";
  const folder = "pictures";

  const gallery = document.getElementById("auto-gallery");

  fetch(`https://github.com{username}/${repo}/contents/${folder}`)
    .then(async res => {
      const data = await res.json();
      if (!res.ok) throw new Error(`GitHub Error (${res.status}): ${data.message}`);
      return data;
    })
    .then(files => {
      const images = files.filter(file => /\.(jpe?g|png|webp|gif)$/i.test(file.name));
      if (images.length === 0) {
        gallery.insertAdjacentHTML("beforeend", `<p style="color:red;">Connected, but 0 images found in "${folder}".</p>`);
        return;
      }
      images.forEach(file => {
        const title = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
        gallery.insertAdjacentHTML("beforeend", `
          <figure class="card">
            <a href="${file.download_url}" target="_blank" rel="noopener noreferrer">
              <div class="media-wrap">
                <img src="${file.download_url}" alt="${title}" loading="lazy">
              </div>
            </a>
            <figcaption><strong style="text-transform: capitalize;">${title}</strong><span>Design showcase</span></figcaption>
          </figure>
        `);
      });
    })
    .catch(err => {
      gallery.insertAdjacentHTML("beforeend", `<p style="color:red; padding:16px; background:#fee; border-radius:8px;"><strong>Debug:</strong> ${err.message}</p>`);
    });
</script>

</body>
</html>
